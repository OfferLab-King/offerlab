packages:
  - "."

engineStrict: true
saveExact: true
strictPeerDependencies: true

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security override for GHSA-qx2v-qp2m-jg93 in Next.js's pinned PostCSS dependency.
minimumReleaseAgeExclude:
  - brace-expansion@1.1.18
  - brace-expansion@5.0.9
  - js-yaml@4.3.1
  - nanoid@3.3.18
  - postcss@8.5.26

overrides:
  "brace-expansion@^1.0.0": 1.1.18
  "brace-expansion@^5.0.0": 5.0.9
  "js-yaml@^4.0.0": 4.3.1
  "nanoid@^3.0.0": 3.3.18
  postcss: 8.5.26
  sharp: 0.35.0
